name: "Deploy Now: Orchestration"
run-name: "Deploy Now: Build website1 · ${{ github.event.head_commit.message || format('Triggered by {0}', github.triggering_actor) }}"

on:
  push:
  workflow_dispatch:

jobs:
  retrieve-project:
    name: check readiness
    runs-on: ubuntu-latest
    outputs:
      deployment-enabled: ${{ fromJson(steps.project.outputs.info).deployment-enabled }}
      branch-id: ${{ fromJson(steps.project.outputs.info).branch-id }}
    steps:
      - name: Fetch project data
        uses: ionos-deploy-now/project-action@v1
        id: project
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 126e2dc0-4a04-4e3e-a934-08c74a8de071
          action: retrieve-info

  build:
    name: build
    needs: retrieve-project
    if: ${{ needs.retrieve-project.outputs.deployment-enabled == 'true' }}
    uses: ./.github/workflows/website1-build.yaml
    with:
      site-url: https://IONOS_DEPLOY_NOW_SITE_URL
      branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
    secrets: inherit

  resolve-deployments:
    name: resolve deployment ids
    needs:
      - retrieve-project
      - build
    runs-on: ubuntu-latest
    outputs:
      deployment-ids: ${{ steps.ids.outputs.ids }}
    steps:
      - name: Fetch deployment ids
        id: ids
        env:
          IONOS_API_KEY: ${{ secrets.IONOS_API_KEY }}
          PROJECT_ID: 126e2dc0-4a04-4e3e-a934-08c74a8de071
          BRANCH_ID: ${{ needs.retrieve-project.outputs.branch-id }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -H "Authorization: API-Key ${IONOS_API_KEY}" \
            "https://api-us.ionos.space/v4/accounts/me/projects/${PROJECT_ID}/branches/${BRANCH_ID}/deployments")
          echo "$RESP"
          printf '%s' "$RESP" > /tmp/ionos-deployments.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/ionos-deployments.json").read_text())
          values = data.get("values") or data.get("items") or []
          ids = [item.get("id") for item in values if item.get("id")]
          if not ids:
              raise SystemExit("No IONOS deployment IDs were returned")
          Path("/tmp/ionos-deployment-ids.txt").write_text(json.dumps(ids))
          PY
          echo "ids=$(cat /tmp/ionos-deployment-ids.txt)" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy to IONOS
    needs:
      - retrieve-project
      - resolve-deployments
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      matrix:
        deployment-id: ${{ fromJson(needs.resolve-deployments.outputs.deployment-ids) }}
    steps:
      - name: Update deployment status
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 126e2dc0-4a04-4e3e-a934-08c74a8de071
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: in_progress

      - name: Retrieve stored deployment
        uses: ionos-deploy-now/artifact-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 126e2dc0-4a04-4e3e-a934-08c74a8de071
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          version: ${{ github.sha }}
          action: download

      - name: Fetch deployment info
        uses: ionos-deploy-now/project-action@v1
        id: deployment
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 126e2dc0-4a04-4e3e-a934-08c74a8de071
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: retrieve-info

      - name: Render templates
        uses: ionos-deploy-now/template-renderer-action@v2
        with:
          deployment-id: ${{ matrix.deployment-id }}
          data: "[${{ steps.deployment.outputs.template-variables }}, ${{ toJson(secrets) }}]"
          input-directory: deployment
          output-directory: deployment
          intermediate-data-file: deployment/.template-renderer-data

      - name: Render real site-url to all files
        run: |
          for file in `grep -rl 'https://IONOS_DEPLOY_NOW_SITE_URL' .`; do
            sed -i $file -e 's|https://IONOS_DEPLOY_NOW_SITE_URL|${{ fromJson(steps.deployment.outputs.info).site-url }}|g'
          done

      - name: Render SSH user secret name
        run: echo SSH_USERNAME_SECRET=IONOS_DEPLOYMENT_`echo ${{ matrix.deployment-id }} | tr '[:lower:]' '[:upper:]' | tr '-' '_'`_SSH_USERNAME >> $GITHUB_ENV

      - name: Deploy to IONOS
        uses: ionos-deploy-now/deploy-to-ionos-action@v2
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 126e2dc0-4a04-4e3e-a934-08c74a8de071
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          deployment-info: ${{ steps.deployment.outputs.info }}
          ssh-user: ${{ secrets[env.SSH_USERNAME_SECRET] }}
          ssh-key: ${{ secrets.IONOS_SSH_KEY }}

      - name: Update deployment status
        if: ${{ always() }}
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 126e2dc0-4a04-4e3e-a934-08c74a8de071
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          deployment-id: ${{ matrix.deployment-id }}
          action: update-status
          status: ${{ job.status }}

  notify-deployment-finished:
    name: finish IONOS status
    needs:
      - retrieve-project
      - deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify all deployments finished
        uses: ionos-deploy-now/project-action@v1
        with:
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          project-id: 126e2dc0-4a04-4e3e-a934-08c74a8de071
          branch-id: ${{ needs.retrieve-project.outputs.branch-id }}
          action: set-deployments-finished
